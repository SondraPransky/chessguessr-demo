# Publishes the Chessguessr demo (index.html: ~600 positions, answers scrambled, no server) on GitHub Pages.
# Built from the private chessguessr repo (scripts/build_site.py demo page). Nothing else is published here.
name: GitHub Pages (démo)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # Two jobs (GitHub's standard layout): deploying in the same job right after the upload sometimes
  # fails with "No artifacts named github-pages were found", because the artifact isn't listed yet.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
